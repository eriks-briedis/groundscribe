# Pre-commit hooks enforcing the quality gates and commit conventions from
# CONTRIBUTING.md. Install with `uv run pre-commit install` and the commit-msg
# hook with `uv run pre-commit install --hook-type commit-msg`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Local hooks run in the uv-managed environment so they match CI exactly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: conventional-commit-msg
        name: conventional-commit message prefix
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
