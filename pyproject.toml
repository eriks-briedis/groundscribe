[project]
name = "groundscribe"
version = "0.1.0"
description = "Technical Writer Pipeline — a local-first, inspectable editorial workflow system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Eriks Briedis", email = "eriks.briedis@gmail.com" }]
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "fastapi>=0.115.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "types-pyyaml>=6.0.12.20260724",
]

[project.scripts]
# The spec's CLI is `writer`; the distribution is groundscribe.
writer = "groundscribe.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/groundscribe"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "tests", "scripts"]
# Alembic revisions are autogenerated from the models; their long enum/DDL lines
# are not worth hand-wrapping. The migration round-trip tests guard correctness.
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["groundscribe"]

# ---------------------------------------------------------------------------
# mypy — strict typing across source and tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
files = ["backend/src", "backend/tests", "scripts", "tests"]
# The two suites each contribute a ``conftest``; mypy sees them as one duplicate
# top-level module. Both are three lines of re-exports over ``db_fixtures``,
# which *is* checked, so excluding them costs no coverage.
exclude = ["(^|/)conftest\\.py$"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend/src"]
testpaths = ["backend/tests", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=groundscribe",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["groundscribe"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
