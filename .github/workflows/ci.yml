name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type-check · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      # pyproject enforces the coverage gate via --cov-fail-under; a drop fails CI.
      - name: Pytest with coverage gate
        run: uv run pytest

  frontend:
    name: types · contract · component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The committed types must be what the committed contract produces. The
      # vitest suite asserts it too; failing here says *regenerate*, in one line,
      # rather than through a diff of a 130kB file.
      - name: Contract types are up to date
        run: |
          npm run contract
          git diff --exit-code ../contracts/api-types.ts

      - name: TypeScript (strict)
        run: npm run typecheck

      - name: Component and contract tests
        run: npm test
