# Serving the built web app, and proxying the API beside it (phase 14).
#
# One origin for both, which is what the Vite dev proxy arranges on a laptop.
# The browser then needs no CORS negotiation, the session cookie is same-site by
# construction, and the SSE stream is an ordinary same-origin request.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: every path that is not a file is the app's own route,
    # so it gets the app rather than a 404 from a server that has never heard of
    # `/projects/abc123`.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Progress is server-sent events. Buffering would hold each frame until
        # nginx decided it had enough of them, which presents as a dashboard
        # that updates in bursts minutes after the work happened.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
