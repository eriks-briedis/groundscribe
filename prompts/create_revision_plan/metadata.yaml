template_id: create_revision_plan
description: >
  Turn the review findings the author accepted into a coherent plan the rewrite
  can follow, reconciling the ones that contradict each other (plan/07 §9).
current_version: v3
versions:
  v1:
    system: >
      You turn accepted review feedback into a plan a rewriter will follow exactly.
      Feedback is not instructions: two findings often disagree, and applying both
      produces an article that argues with itself. You decide, and you say why.
      You never invent changes nobody asked for, and you never quietly drop a
      finding the author accepted — if you cannot apply it, you say whether you
      combined it, deferred it, or rejected it, and on what grounds.
    required_variables: [accepted, dismissed, draft, brief, verdict]
    output_schema_version: 1
    notes: >
      Initial version. The dismissed findings are supplied so the plan cannot
      reintroduce something the author has already argued down.
  v2:
    system: >
      You turn accepted review feedback into a plan a rewriter will follow exactly.
      Feedback is not instructions: two findings often disagree, and applying both
      produces an article that argues with itself. You decide, and you say why.
      You never invent changes nobody asked for, and you never quietly drop a
      finding the author accepted — if you cannot apply it, you say whether you
      combined it, deferred it, or rejected it, and on what grounds. Where you
      name a claim, you name it by the id the draft uses, never by quoting what
      it says.
    required_variables: [accepted, dismissed, draft, brief, verdict]
    output_schema_version: 1
    notes: >
      v1 asked the planner to name "the claims that must not change" and never
      said in what form. `check_plan` compares that list against the draft's
      `claims_used`, which holds claim ids, so the field the guard checks was
      again the field the prompt did not describe.

      The failure that produced: the planner returned twelve claim *sentences*.
      None of them is an id, so all twelve were unknown, and the refusal was a
      paragraph of prose with commas in it.

      Third instance of one pattern in one afternoon — `suggested_route`,
      `source_ref`, and now `claims_that_must_not_change`. A field a schema
      validates and a prompt does not describe is a field the model fills by
      guessing.
  v3:
    system: >
      You turn accepted review feedback into a plan a rewriter will follow exactly.
      Feedback is not instructions: two findings often disagree, and applying both
      produces an article that argues with itself. You decide, and you say why.
      You never invent changes nobody asked for, and you never quietly drop a
      finding the author accepted — if you cannot apply it, you say whether you
      combined it, deferred it, or rejected it, and on what grounds. Where you
      name a claim, you name it by the id the draft uses, never by quoting what
      it says. The replacement prose you write is bound by the source model
      exactly as the draft is: you correct an unsupported claim by cutting it or
      qualifying it down to what the source says, never by substituting a
      different specific claim that reads better.
    required_variables: [accepted, dismissed, draft, brief, source_model, verdict]
    output_schema_version: 1
    notes: >
      The planner was told at the foot of its own instructions that "the brief
      settles scope disputes; the source model settles factual ones" — about a
      document it had never been given. `required_variables` on v1 and v2 is
      `[accepted, dismissed, draft, brief, verdict]`, and the stage passed
      exactly those. Every other stage that writes prose gets the source model;
      this one composes the replacement text the rewrite carries out, and did not.

      The failure that produced: a plan addressed a blocking finding about an
      unsupported scope-drift mechanism by dictating its own replacement —
      "adjacent material can enter, later rewrites can blur the brief's reader
      question, and the result can become a polished version of the wrong
      article". The rewrite followed it faithfully. Rescoring the result found
      those two sentences as `u002` and `u003`, both unsupported: the source
      establishes weak scope control and unfocused articles, and says nothing
      about context adjacency, about blurred reader questions, or about the
      result being polished. One unsupported claim had been removed and two
      written in its place, by the stage whose job was to remove it.

      This version supplies the source model, states that replacement prose is a
      factual assertion made on the article's behalf, names the specific error —
      treating a claim about a category as licence for a mechanism, a
      consequence, or an example within it — and says that a change needing a
      fact the source lacks is a `factual_gap` to be reported rather than
      supplied.

      What it cost, and what was done about it. Adding the variable took the
      stage from 14,040 input tokens to 59,761 — measured on the two plan calls
      of the run of 2026-08-06, which is the largest single-line cost increase in
      the repository's history. The obvious response, dropping it again, would
      reinstate the defect above, so the stage now passes the source model
      *scoped* instead: the claims the draft declares it used, unioned with the
      claims the brief cites, with segment ids stripped
      (`groundscribe.stages.payload.source_model_payload`). On the same run that
      is 81 claims down to 44 and 61,933 characters down to 23,293. The planner
      keeps every claim the article rests on — which is the set it can legitimately
      qualify a sentence down to — and stops being shown the material the
      architecture routed to a different article, which it was never entitled to
      write from anyway.
