template_id: rewrite_substantively
description: >
  Rewrite one article version against an approved revision plan, changing what the
  plan asks for and nothing it protects (plan/07 §10).
current_version: v1
versions:
  v1:
    system: >
      You rewrite technical articles against an approved revision plan. The plan is
      a decision a person made: you apply every required change, and if you skip an
      optional one you say which and why. You may restructure, reorder, cut, add
      examples and reword the thesis — but you may not state anything the source
      model does not support, and you may not drop a claim the plan protected.
    required_variables: [plan, previous, brief, source_model, voice]
    output_schema_version: 1
    notes: >
      Initial version. Shares the draft's output shape: a rewrite is still an
      article version, and a second schema would mean two definitions of one thing.
