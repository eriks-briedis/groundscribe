# Per-stage model routing — the `openai` profile (plan/04, phase 15).
#
# A *profile*: a whole policy file, named beside the default, that a project
# selects with `PUT /projects/{id}/routing-profile` or
# `writer project routing --profile openai`. Projects that choose nothing run
# `model-routing.yaml`, which is local. Nothing here takes effect for a project
# that has not asked for it.
#
# Derived from version 11's structure — the same stages, in the same order, with
# the same per-stage reasoning about which need judgement and which need prose.
# What changed is everything that was sized around a local model, and there is
# more of that than a provider field.
#
# ---------------------------------------------------------------------------
# What is different from the local default, and why
# ---------------------------------------------------------------------------
#
# **No `context_window`, anywhere.** The field exists because Ollama allocates a
# window per call and silently truncates the prompt above it, so a stage that did
# not name one lost the middle of its own input. OpenAI allocates its own; naming
# a window here would be describing a decision this provider does not let you
# make. This is the field the local profile calls a memory decision, and it is
# the reason a project whose source outgrew the local window has somewhere to go.
#
# **No `temperature`, and no `top_p`.** Not an oversight and not a downgrade:
# the reasoning models reject both outright, and the adapter sends only what the
# policy sets (`_sampling` in `adapters/openai.py`), so a temperature here is a
# 400 at the first call rather than a knob. Version 9 set them and predates the
# probe that would have caught it. The gradient version 11 expresses as
# temperature — determinism for judging, breadth for prose — is expressed here as
# `reasoning_effort`, which is the same intent in this provider's own terms.
#
# **The fallback changes the model, not the call.** Locally there is one model
# and no second to escalate to, so each fallback re-issues the same request with
# a smaller window: a real second chance at the two things that actually go wrong
# on a 16 GB GPU. Neither goes wrong here. On a metered API the rung means what
# it originally meant — try something cheaper and steadier — so it drops to
# `gpt-5-mini`. One stage opts out, for the same reason it opts out locally; see
# the note above `extract_source_truth`.
#
# **`native_schema`, not `json_mode`** — reversed, and the reason it was the
# other way round is worth keeping. Strict mode accepts a *subset* of JSON Schema:
# every property required, `additionalProperties: false`, no content constraints.
# Pydantic's own output satisfies none of those by construction, so setting
# `native_schema` used to mean a 400 on every call.
#
# `_strict_schema` in `llm/adapters/openai.py` now rewrites the schema into that
# subset on the way out — promoting defaulted fields to required, dropping
# `minItems` and friends — so the pipeline's schemas can stay as they are. The
# constraints that get dropped are still enforced, by the schema that parses the
# response, and still become repair feedback; strict mode governs the shape and
# Pydantic governs the contents.
#
# The bill is what forced it. Under `json_mode` the provider promises well-formed
# JSON and nothing about the fields, so `extract_source_truth` returned a claim's
# body as `statement` where the schema says `text` — twice, at full length, fully
# billed, before a third attempt happened to guess right. 68% of that run's cost
# bought nothing. A wrong shape is now unrepresentable rather than repairable.
#
# **Output budgets are version 11's, not version 9's.** How long an answer this
# pipeline asks for is a property of the work, not of the model that does it —
# `extract_source_truth` needs 16384 because a 60-page source produced that much
# evidence, and it needed it on Ollama for the same reason it needs it here.
# Version 9's 8192 predates the measurement.
#
# ---------------------------------------------------------------------------
# Before your first run on this profile
# ---------------------------------------------------------------------------
#
#   export OPENAI_API_KEY=sk-...
#   uv run writer llm probe --profile openai   # calls each model, once
#
# `probe` answers the two things this file cannot state about itself: whether
# these model ids exist for that key, and whether they accept the parameters set
# below. Both of its failure modes are one edit away from fixed.
#
# Two gates, not one. A key on the machine makes OpenAI *reachable*; a project
# must still name `openai` in `allowed_providers` (phase 13) before any of its
# material moves. Selecting this profile is a third, separate statement — where
# the calls go — and it does not imply either of the other two. A project that
# selects `openai` without permitting it fails at the stage, loudly, saying so.
#
# Costs money, unlike the default. `config/model-pricing.yaml` ships empty on
# purpose: nobody preparing this repository can know what an account pays, and a
# guessed price is a cost metric that is confidently wrong. Fill it in and
# `writer llm probe` will report which of the models below are priced.
version: "11-openai"
description: >
  OpenAI, split flagship/mini: gpt-5 for the stages that judge or write, gpt-5-mini
  for the cheap deterministic checks and every fallback rung. Version 11's stage
  reasoning, with the local sizing removed.

# Unrouted stages land here. Deliberately conservative — a stage nobody has
# thought about yet should be cheap and deterministic, not creative.
default:
  primary:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: low
    structured_output_mode: native_schema
    timeout_seconds: 120.0

# ---------------------------------------------------------------------------
# How every `max_output_tokens` below was arrived at
# ---------------------------------------------------------------------------
#
#   max_output_tokens = answer + reasoning headroom
#   headroom: high 32768 · medium 16384 · low 8192
#
# On a reasoning model `max_completion_tokens` bounds reasoning tokens *and*
# visible output together. Every number in this file was inherited from the local
# profile, where it bounded the answer alone — so each one was measuring the wrong
# quantity, and the ones at high effort were measuring it by the largest margin.
#
# This is not a theory. `generate_gap_questions` writes 515–801 output tokens on a
# good day, was given 4096, and hit that ceiling exactly on its first real call:
# the answer needed a thousand tokens and the reasoning wanted the rest. Sizing
# from the answer alone would have "fixed" it at 8192 and failed again.
#
# The `answer` term is the local profile's number, except where a real run has
# measured a bigger one — see `extract_source_truth`, whose accepted answer ran to
# 22–35k tokens and whose inherited 16384 was therefore also wrong about the
# answer, independently of reasoning.
#
# Sizing up is close to free and failing is not: a cap is not an allocation, so
# the call is billed for tokens produced, while an exceeded cap throws away the
# whole stage and the wall-clock that went into it. Where a stage should not be
# writing at length, the limit that says so is its prompt, not a ceiling that
# turns a long answer into an unparseable one.

stages:
  # Structure matters more than style here, and a schema violation costs a repair
  # round-trip. A fixed seed: extraction should be reproducible across re-runs of
  # the same source.
  extract_claims:
    rationale: >
      Structured fidelity dominates; reproducibility matters for re-runs of the
      same source.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 24576
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 20480
      timeout_seconds: 180.0

  # The phase-06 editorial stages. Extraction is the one place a mistake is
  # permanent — everything downstream is checked against the source model, so a
  # claim misclassified here is wrong in every article that follows. The highest
  # reasoning effort in the file, and the largest output budget: a source model
  # cut off mid-answer is a source the pipeline never finished reading.
  #
  # 65536, and the two reasons it is not the default profile's 16384 are both
  # reasons this profile exists.
  #
  # **16384 was an upper bound that had never been reached, and then it was.** It
  # came from a 60-page source that ran past 8192 — the bulk of it evidence, one
  # claim carrying a list of segment ids. A 532-segment source ran past 16384 as
  # well, truncating identically on Ollama and on gpt-5, so this is a fact about
  # the source rather than about either provider.
  #
  # **On a reasoning model the budget is not all answer.** `max_completion_tokens`
  # bounds reasoning tokens *and* visible output together, so `reasoning_effort:
  # high` spends some unknowable part of this number before the first character of
  # JSON. The default profile's 16384 never had to cover that, which makes it the
  # wrong number here twice over.
  #
  # Sized generously rather than to a measurement, because the asymmetry says to:
  # a cap is not an allocation — the call is billed for tokens produced, so an
  # unused budget costs nothing, while an exceeded one costs the whole extraction.
  # The default profile could not do this: 16384 there is pinned by
  # `context_window: 65536`, which the ~49k-token prompt very nearly fills.
  extract_source_truth:
    rationale: >
      Source truth is the one artefact that is not disposable; structured
      fidelity and reproducibility dominate everything else. Its answer is also
      the longest this pipeline asks for, and on a reasoning model the budget is
      shared with reasoning, so it is sized for the worst case rather than the
      measured one.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 65536
      timeout_seconds: 600.0
    # The one fallback in this file that does not drop to the mini, which is a
    # decision rather than an oversight. Escalating *down* is only useful when the
    # model was the problem, and here it is the artefact nothing downstream can
    # correct: a cheaper second opinion on source truth is a worse source model,
    # kept. So this rung is a genuine second attempt at the same call — which is
    # what helps against the transient failure that actually reaches it — and the
    # budget does not shrink, because shrinking it is what produced the failure
    # being retried in the first place.
    fallback:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 65536
      timeout_seconds: 600.0

  # Gap analysis is a judgement about *absence*, which is harder than extraction
  # and much cheaper to get wrong in the safe direction: an unnecessary question
  # costs the author a moment, a missed blocking gap costs the article's honesty.
  #
  # **The budget here is reasoning, not answer, and the two failed differently.**
  # `extract_source_truth` overflowed because its answer really was that long.
  # This stage's answer is small — three accepted runs produced 515, 622 and 801
  # output tokens — and it still hit 4096 exactly, on a 40,732-token input.
  # Almost all of that ceiling went to reasoning before a question was written.
  # This is the stage that produced the rule at the top of the file, and the one
  # that shows why sizing from the answer alone would have picked 8192 and failed
  # again: 4096 answer + 32768 headroom, with the answer term left at the local
  # profile's figure because no run here has measured a bigger one.
  generate_gap_questions:
    rationale: >
      Judging what is missing needs the model's full attention; the cost of a
      false positive is one ignored question, of a false negative a misleading
      article. The budget is reasoning headroom rather than answer length, which
      is why it dwarfs the answers this stage has actually produced.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 36864
      timeout_seconds: 300.0
    # Smaller than the primary because `reasoning_effort: medium` on the mini is a
    # genuinely smaller reasoning spend — but not 2048, and the reason applies to
    # every fallback in this file. This rung is never reached by a truncation: the
    # ladder escalates those without retrying (`llm/generation.py:381`), precisely
    # because a fallback that degrades the call would retry with less room than
    # the ceiling that just proved too small. It is reached by a provider error or
    # a bad schema, and arriving there with a budget that cannot hold the
    # reasoning turns one recoverable failure into two.
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 18432
      timeout_seconds: 180.0

  # Architecture is where breadth earns its keep: the point is to surface
  # *alternatives*, and the decision record is only worth reading if the
  # alternatives were real. Locally that is bought with temperature; here it is
  # bought with reasoning effort, the sampling knobs being unavailable.
  propose_content_architecture:
    rationale: >
      Comparing competing shapes needs some exploration; the decision record is
      only worth reading if the alternatives were real.
    primary:
      provider: openai
      model: gpt-5
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 38912
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 19456
      timeout_seconds: 180.0

  # The brief is a contract the drafter is bound by and the validator checks
  # against, so it takes a fixed seed: a brief that varied between runs would make
  # two drafts of the same article incomparable for reasons that have nothing to
  # do with the drafting.
  generate_article_brief:
    rationale: >
      A contract must be reproducible; the creativity belongs in the draft, not
      in the specification the draft is judged against.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 20480
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 18432
      timeout_seconds: 180.0

  # The phase-06 placeholder for what phase 07 now routes as
  # `generate_initial_draft`; kept so a run recorded under it can still be
  # explained. No fallback, as in versions 8, 9 and 11 — nothing routes here.
  draft_article:
    rationale: Voice and readability dominate; the draft is disposable.
    primary:
      provider: openai
      model: gpt-5
      reasoning_effort: medium
      structured_output_mode: prompted
      max_output_tokens: 32768
      timeout_seconds: 600.0

  # The draft is the one stage whose output is mostly prose, and the only one that
  # writes thousands of words in a single call — hence the largest budget and the
  # longest timeout. The prose arrives inside a structured envelope carrying the
  # claims, qualifications and markers that make it checkable, which is what the
  # pipeline actually validates.
  generate_initial_draft:
    rationale: >
      Readability dominates and the draft is disposable; the declarations around
      the prose are what the pipeline actually checks.
    primary:
      provider: openai
      model: gpt-5
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 32768
      timeout_seconds: 600.0
    fallback:
      provider: openai
      model: gpt-5-mini
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 24576
      timeout_seconds: 300.0

  # Review judges rather than creates, and reads the draft *and* the source model
  # it is checked against. A fixed seed: two reviews of the same draft that
  # disagree with each other would make the revision loop's progress unmeasurable.
  review_substantively:
    rationale: >
      Judging fidelity is the hardest thing asked of the model; determinism is
      what makes round-to-round improvement measurable rather than noise.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 40960
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 20480
      timeout_seconds: 180.0

  # Planning is a judgement about *other* judgements — which feedback wins when
  # two disagree. A planner that reconciled the same contradiction differently on
  # two runs would make the revision loop impossible to reason about, and this is
  # the reasoning read most often afterwards.
  create_revision_plan:
    rationale: >
      Reconciling contradictory feedback is the hardest judgement in the loop and
      the one whose reasoning is read most often afterwards.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 36864
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 18432
      timeout_seconds: 180.0

  # The rewrite is prose again, and bound by a plan and a previous version.
  rewrite_substantively:
    rationale: >
      Prose quality matters, but the rewrite is constrained by a plan; less
      latitude than the first draft, for the same reason.
    primary:
      provider: openai
      model: gpt-5
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 32768
      timeout_seconds: 600.0
    fallback:
      provider: openai
      model: gpt-5-mini
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 24576
      timeout_seconds: 300.0

  # The voice pass is the one stage whose whole job is how the prose sounds. No
  # seed, because the same prose read twice should be allowed to suggest
  # different phrasings — and every edit it makes is quoted back and checked
  # against the text it claims to have replaced, so latitude costs a refused pass
  # rather than a silent rewrite.
  align_voice:
    rationale: >
      Style judgement wants range; the edit-level checks are what make that safe
      here, not determinism.
    primary:
      provider: openai
      model: gpt-5
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 32768
      timeout_seconds: 600.0
    fallback:
      provider: openai
      model: gpt-5-mini
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 24576
      timeout_seconds: 300.0

  # Scoring is the most consequential judging call in the pipeline: it decides
  # whether the loop runs again. A fixed seed, because a score that moved between
  # two runs of the same article would make every trend the product shows a person
  # meaningless — including the stagnation detection that decides when to stop.
  score_article:
    rationale: >
      Determinism is the requirement here, not creativity: scores are compared
      against each other, and a noisy scorer makes the comparison worthless.
    primary:
      provider: openai
      model: gpt-5
      seed: 20260725
      reasoning_effort: high
      structured_output_mode: native_schema
      max_output_tokens: 40960
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: medium
      structured_output_mode: native_schema
      max_output_tokens: 20480
      timeout_seconds: 180.0

  # Validation must be boring and repeatable. It judges, it does not create, and
  # it runs on every loop — so it is the one judging stage that starts on the mini
  # and the only one at low effort.
  validate_article:
    rationale: Deterministic judging; it runs on every loop, so it stays cheap.
    primary:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: low
      structured_output_mode: native_schema
      max_output_tokens: 12288
      timeout_seconds: 240.0
    fallback:
      provider: openai
      model: gpt-5-mini
      seed: 20260725
      reasoning_effort: low
      structured_output_mode: native_schema
      max_output_tokens: 10240
      timeout_seconds: 180.0
