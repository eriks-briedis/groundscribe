# Per-stage model routing (plan/04).
#
# Which provider and model each editorial stage runs against, with the parameters
# that shape the call. Edited by hand; every execution records the `version`
# below, so bump it whenever a routing choice changes — superseded versions live
# in git history, and a run that cannot name its routing version cannot be
# explained afterwards.
#
# ---------------------------------------------------------------------------
# Version 9 moves this file from local models to OpenAI.
# ---------------------------------------------------------------------------
#
# Version 8 routed every stage to a local Ollama installation, which is what
# "local-first" meant while nothing could actually call a provider. It is in git
# history and switching back is this one file.
#
# What has *not* changed is the per-stage reasoning: which stages need judgement
# and which need prose, where determinism matters more than range, and where a
# mistake is permanent. Only the models underneath moved. Each stage keeps its
# rationale so the choice can be argued with rather than inherited.
#
# The split is flagship for the work that decides things, mini for the work that
# is cheap and repetitive — the same shape as the 70b/8b split it replaces, for
# the same reasons.
#
# ---------------------------------------------------------------------------
# Before your first run
# ---------------------------------------------------------------------------
#
#   export OPENAI_API_KEY=sk-...          # from platform.openai.com
#   uv run writer llm probe               # calls each routed model, once
#
# `probe` sends one real request per distinct model *with the parameters set
# below*, and reports what came back. It exists because two things here can only
# be confirmed against a live account:
#
#   1. **Whether these model ids exist for your key.** Model names change and
#      access differs by account. Any id you have access to is a valid edit.
#   2. **Whether a model accepts these sampling parameters.** Reasoning models
#      reject `temperature` and `top_p` outright. If probe reports that, delete
#      those two keys for that stage — the adapter sends only what is set here,
#      so an absent parameter is genuinely not sent, and the run proceeds on the
#      provider's own defaults.
#
# Nothing is sent to OpenAI until a *project* also names it in
# `allowed_providers` (phase 13). Configuring a key makes the provider reachable;
# the author still decides, per project, whether their material may go there.
version: "9"
description: >
  OpenAI, split flagship/mini: the flagship for the stages that judge or write,
  the mini for the cheap deterministic checks and every fallback rung.

# Unrouted stages land here. Deliberately conservative — a stage nobody has
# thought about yet should be cheap and deterministic, not creative.
default:
  primary:
    provider: openai
    model: gpt-5-mini
    temperature: 0.0
    structured_output_mode: json_mode
    timeout_seconds: 120.0

stages:
  # Structure matters more than style here, and a schema violation costs a repair
  # round-trip, so this is where a natively schema-constrained model earns its
  # price. Temperature 0 with a fixed seed: extraction should be reproducible.
  extract_claims:
    rationale: >
      Structured fidelity dominates; reproducibility matters for re-runs of the
      same source.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # The phase-06 editorial stages. Extraction is the one place a mistake is
  # permanent — everything downstream is checked against the source model, so a
  # claim misclassified here is wrong in every article that follows. It gets the
  # flagship, temperature 0 and a fixed seed, and it gets a fallback because a
  # stage this important should degrade rather than stop.
  extract_source_truth:
    rationale: >
      Source truth is the one artefact that is not disposable; structured
      fidelity and reproducibility dominate everything else.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # Gap analysis is a judgement about *absence*, which is harder than extraction
  # and much cheaper to get wrong in the safe direction: an unnecessary question
  # costs the author a moment, a missed blocking gap costs the article's honesty.
  # Same flagship, same determinism, smaller output.
  generate_gap_questions:
    rationale: >
      Judging what is missing needs the stronger model; the cost of a false
      positive is one ignored question, of a false negative a misleading article.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 4096
      timeout_seconds: 240.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # Architecture is the one structured stage where a little sampling breadth
  # earns its keep: the point is to surface *alternatives*, and a temperature-0
  # model proposes the same obvious shape every time. Still json_mode — the
  # breadth is wanted in the ideas, not in the field names.
  propose_content_architecture:
    rationale: >
      Comparing competing shapes needs some exploration; the decision record is
      only worth reading if the alternatives were real.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.4
      structured_output_mode: json_mode
      max_output_tokens: 6144
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.2
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # The brief is a contract the drafter is bound by and the validator checks
  # against, so it goes back to temperature 0: a brief that varied between runs
  # would make two drafts of the same article incomparable for reasons that have
  # nothing to do with the drafting.
  generate_article_brief:
    rationale: >
      A contract must be reproducible; the creativity belongs in the draft, not
      in the specification the draft is judged against.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 4096
      timeout_seconds: 240.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # Prose, not structure: some sampling breadth is wanted, and the output is
  # disposable by design (plan/00 — generated prose is not source truth). The
  # phase-06 placeholder for what phase 07 now routes as `generate_initial_draft`;
  # kept so a run recorded under it can still be explained.
  draft_article:
    rationale: Voice and readability dominate; the draft is disposable.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.7
      top_p: 0.9
      structured_output_mode: prompted
      max_output_tokens: 16384
      timeout_seconds: 600.0

  # The draft is the one stage whose output is mostly prose, so it gets the
  # sampling breadth a readable article needs — but json_mode, because the prose
  # arrives inside a structured envelope carrying the claims, qualifications and
  # markers that make it checkable. A long output budget: this is the only stage
  # that writes thousands of words in one call.
  generate_initial_draft:
    rationale: >
      Readability dominates and the draft is disposable; the declarations around
      the prose are what the pipeline actually checks.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.7
      top_p: 0.9
      structured_output_mode: json_mode
      max_output_tokens: 16384
      timeout_seconds: 600.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.6
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0

  # Review judges rather than creates, so temperature 0 with a fixed seed: two
  # reviews of the same draft that disagree with each other would make the
  # revision loop's progress unmeasurable. The flagship, because this is where a
  # missed factual error becomes a published one.
  review_substantively:
    rationale: >
      Judging fidelity needs the stronger model; determinism is what makes
      round-to-round improvement measurable rather than noise.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # Planning is a judgement about *other* judgements — which feedback wins when
  # two disagree — so it gets the flagship at temperature 0. A planner that
  # reconciled the same contradiction differently on two runs would make the
  # revision loop's behaviour impossible to reason about.
  create_revision_plan:
    rationale: >
      Reconciling contradictory feedback is the hardest judgement in the loop and
      the one whose reasoning is read most often afterwards.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 4096
      timeout_seconds: 240.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      structured_output_mode: json_mode
      timeout_seconds: 180.0

  # The rewrite is prose again, so the drafting settings — with one difference:
  # a lower temperature, because a rewrite is bound by a plan and by a previous
  # version. Latitude here shows up as drift away from both.
  rewrite_substantively:
    rationale: >
      Prose quality matters, but the rewrite is constrained by a plan; less
      sampling breadth than the first draft, for the same reason.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.5
      top_p: 0.9
      structured_output_mode: json_mode
      max_output_tokens: 16384
      timeout_seconds: 600.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.4
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0

  # The voice pass is the one stage whose whole job is how the prose sounds, so it
  # keeps the prose model and a middling temperature — an ear needs some range.
  # But it is bounded on the other side: every edit it makes is quoted back and
  # checked against the text it claims to have replaced, so sampling breadth costs
  # a refused pass rather than a silent rewrite. No seed, because the same prose
  # read twice should be allowed to suggest different phrasings.
  align_voice:
    rationale: >
      Style judgement wants the stronger prose model; the edit-level checks are
      what make temperature safe here, not determinism.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.6
      top_p: 0.9
      structured_output_mode: json_mode
      max_output_tokens: 16384
      timeout_seconds: 600.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.5
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0

  # Scoring is the most consequential judging call in the pipeline: it decides
  # whether the loop runs again. Temperature 0 with a fixed seed, because a score
  # that moved between two runs of the same article would make every trend the
  # product shows a person meaningless — including the stagnation detection that
  # decides when to stop. The flagship, for the same reason review gets it.
  score_article:
    rationale: >
      Determinism is the requirement here, not creativity: scores are compared
      against each other, and a noisy scorer makes the comparison worthless.
    primary:
      provider: openai
      model: gpt-5
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 8192
      timeout_seconds: 300.0
    fallback:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 4096
      timeout_seconds: 180.0

  # Validation must be boring and repeatable. The mini at temperature 0 is the
  # right trade: this stage judges, it does not create, and it runs on every loop.
  validate_article:
    rationale: Deterministic judging; cost matters because it runs on every loop.
    primary:
      provider: openai
      model: gpt-5-mini
      temperature: 0.0
      seed: 20260725
      structured_output_mode: json_mode
      max_output_tokens: 4096
      timeout_seconds: 180.0
